[project]
name = "prophecy-companion-server"
version = "0.1.0"
description = "Live campaign relay for the Prophecy companion app (Phase 1)."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# A wedged WebSocket receive would otherwise hang forever: dump every thread's
# traceback after 30s so the culprit line is visible immediately.
faulthandler_timeout = 30

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# ANN = flake8-annotations: every function argument and return must be typed.
select = ["E", "F", "I", "UP", "B", "ASYNC", "ANN"]
# ANN401 bans `Any` outright — too strict where a third-party callback genuinely
# hands us an untyped object (e.g. the raw DBAPI connection).
ignore = ["ANN401"]

# Ruff's ANN only checks that annotations EXIST; mypy checks they're TRUE.
# Both are needed — neither replaces the other.
[tool.mypy]
python_version = "3.14"
files = ["app", "tests", "migrations"]
# The core of "enforce type declarations": no silently untyped function bodies.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Alembic's generated env/versions modules aren't import-followable as a package.
module = "migrations.*"
ignore_errors = true
