name: docker

# Publishes the server image to GHCR.
#   - push to main (i.e. a merged PR)  -> :latest and :sha-<commit>
#   - push of a v* tag                 -> :1.2.3, :1.2 and :sha-<commit>
# Never runs on pull requests: a fork PR must not be able to push an image.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    

# A newer push to the same ref wins; the older build is cancelled mid-flight
# rather than racing it to overwrite :latest.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # Gate: the image is only built once ruff/mypy/pytest are green.
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # metadata-action lowercases the name; GHCR rejects uppercase.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            # `is_default_branch` would mean dev — :latest must track main only.
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache in the Actions cache: the uv sync layer is the slow one
          # and only changes when uv.lock does.
          cache-from: type=gha
          cache-to: type=gha,mode=max
